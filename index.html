<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>随机数生成器</title>
  <style>
    /* ---------- 全局重置 ---------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 20% 0%, #1e2a4a 0%, #0b0f1a 60%);
      color: #e6e9f0;
      display: flex;
      justify-content: center;
      padding: 40px 16px 60px;
      -webkit-font-smoothing: antialiased;
    }

    .app { width: 100%; max-width: 720px; }

    h1 { font-size: 1.9rem; text-align: center; letter-spacing: 1px; }
    .sub { text-align: center; color: #8b94a8; font-size: .88rem; margin: 10px 0 28px; }

    /* ---------- 控制面板 ---------- */
    .panel {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 18px;
      padding: 22px;
      backdrop-filter: blur(10px);
    }

    .row { display: flex; gap: 14px; flex-wrap: wrap; }

    .row label {
      flex: 1 1 130px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: .82rem;
      color: #9aa4bb;
    }

    input[type="number"] {
      width: 100%;
      padding: 11px 13px;
      font-size: 1rem;
      color: #fff;
      background: rgba(0, 0, 0, .28);
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 11px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input[type="number"]:focus {
      border-color: #5b8cff;
      box-shadow: 0 0 0 3px rgba(91, 140, 255, .22);
    }

    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 18px 0;
      font-size: .9rem;
      color: #c3cad9;
      cursor: pointer;
      user-select: none;
    }
    .check input { width: 16px; height: 16px; accent-color: #5b8cff; cursor: pointer; }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 11px;
      transition: transform .12s, opacity .2s, background .2s;
    }
    button:active { transform: scale(.97); }

    #generateBtn {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #5b8cff, #8a5bff);
      box-shadow: 0 8px 24px rgba(91, 140, 255, .28);
    }
    #generateBtn:hover { opacity: .92; }

    /* ---------- 结果显示 ---------- */
    .result { margin-top: 22px; }

    .output {
      min-height: 96px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-content: flex-start;
      padding: 18px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 16px;
      font-size: .95rem;
      color: #6f7891;
    }

    .num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 52px;
      padding: 8px 12px;
      font-size: 1.15rem;
      font-weight: 600;
      color: #cfe0ff;
      background: rgba(91, 140, 255, .14);
      border: 1px solid rgba(91, 140, 255, .32);
      border-radius: 10px;
      animation: pop .28s ease both;
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(.6); }
      to   { opacity: 1; transform: scale(1); }
    }

    .error { color: #ff8b8b; font-weight: 500; }

    .actions { display: flex; gap: 12px; margin-top: 14px; }

    .ghost {
      flex: 1;
      padding: 11px;
      font-size: .9rem;
      color: #b9c2d6;
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .1);
    }
    .ghost:hover { background: rgba(255, 255, 255, .12); color: #fff; }

    /* ---------- 历史记录 ---------- */
    .history { margin-top: 30px; }
    .history h2 { font-size: 1rem; color: #9aa4bb; font-weight: 500; margin-bottom: 12px; }

    #historyList { list-style: none; display: flex; flex-direction: column; gap: 8px; }

    #historyList li {
      padding: 10px 14px;
      font-size: .85rem;
      color: #a9b3c8;
      background: rgba(255, 255, 255, .035);
      border-left: 3px solid #5b8cff;
      border-radius: 8px;
      word-break: break-all;
      animation: fadeIn .3s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  ...
</body>
</html>
